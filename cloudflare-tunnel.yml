# name: Cloudflare Tunnel
# description: Expose local ports securely to the internet without opening ports or managing certificates.
# category: Network
# icon: cloud
# version: 2026.5.2
services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
